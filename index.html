<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16506B">
<meta name="robots" content="noindex, nofollow">
<title>Graduierung – MS Rednitzhembach</title>
<link rel="icon" href="symbole/symbol-192.png" type="image/png">
<style>
  :root { --blau: #16506B; --grund: #f4f6f8; --flaeche: #fff; --text: #1b2733; --leise: #5a6b7b; --linie: #d8dee4; }
  @media (prefers-color-scheme: dark) {
    :root { --grund: #12181e; --flaeche: #1c242c; --text: #e8eef4; --leise: #9fb0c0; --linie: #33404c; --blau: #4a9ec4; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
    background: var(--grund); color: var(--text);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  main { width: min(30rem, 100%); text-align: center; }
  .ankersymbol { width: 84px; height: 84px; border-radius: 20px; }
  h1 { font-size: 1.5rem; margin: 1rem 0 0.75rem; }
  .schullogo { width: 210px; max-width: 70%; height: auto; margin: 0 auto 2rem; display: block; }
  a {
    display: block; background: var(--flaeche); color: inherit; text-decoration: none;
    border: 1px solid var(--linie); border-left: 5px solid var(--blau); border-radius: 14px;
    padding: 1.1rem 1.25rem; margin-bottom: 0.75rem; text-align: left;
    box-shadow: 0 1px 3px rgb(20 40 60 / 10%);
  }
  a strong { display: block; font-size: 1.05rem; }
  a span { color: var(--leise); font-size: 0.92rem; }
  a[aria-disabled="true"] { border-left-color: var(--linie); opacity: 0.55; pointer-events: none; }
  footer { margin-top: 2rem; color: var(--leise); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <img class="ankersymbol" src="symbole/symbol-512.png" alt="">
  <h1>Graduierung</h1>
  <picture>
    <source srcset="symbole/schullogo-weiss.png" media="(prefers-color-scheme: dark)">
    <img class="schullogo" src="symbole/schullogo.png"
         alt="Mittelschule Rednitzhembach" width="900" height="237">
  </picture>

  <a href="schueler/">
    <strong>Für Schülerinnen und Schüler</strong>
    <span>Meinen Ausweis ansehen und mich selbst einschätzen</span>
  </a>

  <a href="lehrkraft/" aria-disabled="true">
    <strong>Für Lehrkräfte</strong>
    <span>Wird gerade gebaut</span>
  </a>

  <footer>Alle Daten bleiben auf dem jeweiligen Gerät.</footer>
</main>
</body>
</html>
